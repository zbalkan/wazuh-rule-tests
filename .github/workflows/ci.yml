name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install prerelease test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Validate corpus
        run: python tools/validate_corpus.py

      - name: Validate pytest collection
        run: python -m pytest --collect-only -q

      - name: Build and verify release archive
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          python tools/build_release.py --commit "$GITHUB_SHA"
          cd dist
          sha256sum --check *.sha256
          cd ..
          python - <<'PY'
          import glob
          import json
          import zipfile

          version = json.load(open("corpus.json", encoding="utf-8"))["version"]
          manifest = json.load(open("dist/manifest.json", encoding="utf-8"))
          archive = glob.glob("dist/*.zip")[0]

          with zipfile.ZipFile(archive) as zf:
              archived_manifest = json.loads(zf.read("manifest.json"))

          assert archived_manifest == manifest
          assert manifest["version"] == version
          PY
