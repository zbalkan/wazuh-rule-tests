name: Release corpus

on:
  push:
    tags:
      - "4.*-r*"

permissions:
  contents: write

jobs:
  qualify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate release tag
        run: |
          corpus_version=$(python -c "import json; print(json.load(open('corpus.json'))['corpus_version'])")
          test "$GITHUB_REF_NAME" = "$corpus_version" || {
            echo "Tag $GITHUB_REF_NAME does not match corpus version $corpus_version" >&2
            exit 1
          }

      - name: Install released test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate corpus
        run: python tools/validate_corpus.py

      - name: Build release archive
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          python tools/build_release.py --commit "$GITHUB_SHA"
          cd dist
          sha256sum --check *.sha256
          cd ..
          python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('dist/qualified')"

      - name: Resolve Wazuh qualification target
        run: |
          qualification_target=$(python -c "import json; print(json.load(open('corpus.json'))['wazuh']['qualification_target'])")
          echo "WAZUH_VERSION=$qualification_target" >> "$GITHUB_ENV"

      - name: Install Wazuh manager
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg apt-transport-https
          curl -fsSL https://packages.wazuh.com/key/GPG-KEY-WAZUH |
            gpg --dearmor |
            sudo tee /usr/share/keyrings/wazuh.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main" |
            sudo tee /etc/apt/sources.list.d/wazuh.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "wazuh-manager=$WAZUH_VERSION-1"
          sudo systemctl enable --now wazuh-manager

      - name: Wait for wazuh-logtest
        run: |
          for attempt in $(seq 1 120); do
            if sudo test -S /var/ossec/queue/sockets/logtest; then
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status wazuh-manager --no-pager || true
          sudo journalctl -u wazuh-manager --no-pager -n 100 || true
          exit 1

      - name: Run live Wazuh regression corpus
        run: |
          python_path=$(command -v python)
          sg wazuh -c "$python_path -m pytest dist/qualified/tests -v --wazuh-require-logtest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/manifest.json \
            dist/*.zip \
            dist/*.sha256 \
            --title "Wazuh rule tests $GITHUB_REF_NAME" \
            --generate-notes
