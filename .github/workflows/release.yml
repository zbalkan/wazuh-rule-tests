name: Release corpus

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  WAZUHDEVENV_COMMIT: 3569a7439cacd3e911c8cafcd319fe5afdc4c37f

jobs:
  qualify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Resolve and validate version
        run: |
          version=$(python -c "import json; print(json.load(open('corpus.json'))['version'])")
          test "$GITHUB_REF_NAME" = "$version" || {
            echo "Tag $GITHUB_REF_NAME does not match corpus version $version" >&2
            exit 1
          }
          echo "WAZUH_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install released test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install wazuhdevenv
        run: |
          python -m pip install \
            "git+https://github.com/zbalkan/wazuhdevenv.git@$WAZUHDEVENV_COMMIT"

      - name: Validate corpus
        run: python tools/validate_corpus.py

      - name: Build release archive
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          python tools/build_release.py --commit "$GITHUB_SHA"
          cd dist
          sha256sum --check *.sha256
          cd ..
          python -c "import glob,zipfile; zipfile.ZipFile(glob.glob('dist/*.zip')[0]).extractall('dist/qualified')"

      - name: Provision Wazuh development environment
        env:
          WAZUHDEVENV_HOME: ${{ runner.temp }}/wazuhdevenv
        run: |
          workspace="$RUNNER_TEMP/wazuh-workspace"
          mkdir -p "$workspace"

          wazuhdevenv init "$workspace" \
            --wazuh-version "$WAZUH_VERSION" \
            --skip-corpus

      - name: Run live Wazuh regression corpus
        run: |
          python_path=$(command -v python)
          sudo "$python_path" -m pytest dist/qualified/tests -v --wazuh-require-logtest

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/manifest.json \
            dist/*.zip \
            dist/*.sha256 \
            --title "Wazuh rule tests $GITHUB_REF_NAME" \
            --generate-notes
